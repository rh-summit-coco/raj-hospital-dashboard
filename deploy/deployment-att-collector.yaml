apiVersion: apps/v1
kind: Deployment
metadata:
  name: attestation-collector-secure
  namespace: raj-compliance-dashboard
  labels:
    app: attestation-collector-secure
    app.kubernetes.io/name: attestation-collector
    app.kubernetes.io/instance: attestation-collector-secure
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: coco-beacon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attestation-collector-secure
  template:
    metadata:
      labels:
        app: attestation-collector-secure
        app.kubernetes.io/name: attestation-collector
        app.kubernetes.io/instance: attestation-collector-secure
        app.kubernetes.io/component: collector
    spec:
      containers:
      - name: attestation-collector
        image: image-registry.openshift-image-registry.svc:5000/raj-compliance-dashboard/attestation-collector-secure:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "8443"
        - name: ENABLE_MTLS
          value: "true"
        - name: SERVER_CERT_FILE
          value: "/etc/certs/server.crt"
        - name: SERVER_KEY_FILE
          value: "/etc/certs/server.key"
        - name: CA_CERT_FILE
          value: "/etc/certs/ca.crt"
        volumeMounts:
        - name: server-certs
          mountPath: /etc/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000820000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: server-certs
        secret:
          secretName: attestation-server-certs
          defaultMode: 0400
      securityContext:
        fsGroup: 1000820000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault