# Dashboard backend (live UI + API) - use with Quay image
# Set your image in the Deployment (e.g. quay.io/YOUR_ORG/raj-dashboard-backend:latest)
apiVersion: v1
kind: Namespace
metadata:
  name: raj-compliance-dashboard
  labels:
    app: raj-hospital-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raj-hospital-dashboard
  namespace: raj-compliance-dashboard
  labels:
    app: raj-hospital-dashboard
    component: compliance-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raj-hospital-dashboard
  template:
    metadata:
      labels:
        app: raj-hospital-dashboard
        component: compliance-dashboard
    spec:
      containers:
      - name: dashboard
        # Replace with your Quay image, e.g. quay.io/YOUR_ORG/raj-dashboard-backend:latest
        # image: quay.io/eesposit/raj-dashboard-backend:latest
        image: image-registry.openshift-image-registry.svc:5000/raj-compliance-dashboard/raj-dashboard-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        # Use attestation-collector-secure if you deployed deploy/deployment.yaml (collector)
        - name: COLLECTOR_URL
          value: "http://attestation-collector-secure:8080"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: raj-dashboard-service
  namespace: raj-compliance-dashboard
  labels:
    app: raj-hospital-dashboard
spec:
  selector:
    app: raj-hospital-dashboard
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: raj-dashboard-route
  namespace: raj-compliance-dashboard
  labels:
    app: raj-hospital-dashboard
spec:
  to:
    kind: Service
    name: raj-dashboard-service
  port:
    targetPort: http
  tls:
    termination: edge
  wildcardPolicy: None
