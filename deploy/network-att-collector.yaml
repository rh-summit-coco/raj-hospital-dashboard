apiVersion: v1
kind: Service
metadata:
  name: attestation-collector-secure
  namespace: raj-compliance-dashboard
  labels:
    app: attestation-collector-secure
    app.kubernetes.io/name: attestation-collector
    app.kubernetes.io/instance: attestation-collector-secure
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app: attestation-collector-secure
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: attestation-collector-secure
  namespace: raj-compliance-dashboard
  labels:
    app: attestation-collector-secure
spec:
  to:
    kind: Service
    name: attestation-collector-secure
  port:
    targetPort: https
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect